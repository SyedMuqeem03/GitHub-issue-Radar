name: Issue Scout

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-scout
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required settings
        id: config
        shell: bash
        env:
          GITHUB_REPOS: ${{ vars.ISSUE_SCOUT_REPOS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$GITHUB_REPOS" || -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set the ISSUE_SCOUT_REPOS variable and SLACK_WEBHOOK_URL secret to enable Issue Scout."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore issue scan state
        if: steps.config.outputs.configured == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/issue-scout.sqlite3
          key: issue-scout-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            issue-scout-state-

      - name: Check monitored repositories
        if: steps.config.outputs.configured == 'true'
        env:
          GITHUB_REPOS: ${{ vars.ISSUE_SCOUT_REPOS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.ISSUE_SCOUT_GITHUB_TOKEN }}
          DATABASE_PATH: data/issue-scout.sqlite3
        run: python -m issue_scout --once

      - name: Save issue scan state
        if: ${{ always() && steps.config.outputs.configured == 'true' && hashFiles('data/issue-scout.sqlite3') != '' }}
        uses: actions/cache/save@v6
        with:
          path: data/issue-scout.sqlite3
          key: issue-scout-state-${{ github.run_id }}-${{ github.run_attempt }}
